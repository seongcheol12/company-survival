<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회사에서 살아남기</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#f5f5f5;
    font-family:'맑은 고딕',sans-serif;
}

#damage{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:red;
    opacity:0;
    pointer-events:none;
    transition:0.1s;
}

#startScreen{
    position:fixed;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

#startBox{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
    text-align:center;
    max-width:420px;
}

input{
    padding:10px;
    font-size:18px;
    width:220px;
}

button{
    padding:12px 24px;
    font-size:18px;
    cursor:pointer;
}

#title{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    font-weight:bold;
}

#score{
    position:absolute;
    top:15px;
    left:15px;
    font-size:24px;
    font-weight:bold;
}

#life{
    position:absolute;
    top:50px;
    left:15px;
    font-size:28px;
}

#nicknameBox{
    position:absolute;
    top:90px;
    left:15px;
    font-size:18px;
    font-weight:bold;
}

#guide{
    position:absolute;
    top:130px;
    left:15px;
    background:white;
    padding:12px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.15);
    line-height:1.8;
    font-size:16px;
}

#player{
    position:absolute;
    bottom:20px;
    left:300px;
    font-size:70px;
}

.item{
    position:absolute;
    font-size:70px;
}

.hit{
    animation:shake 0.2s;
}

@keyframes shake{
    0%{transform:translateX(-5px);}
    25%{transform:translateX(5px);}
    50%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
    100%{transform:translateX(0);}
}

#level{
    position:absolute;
    top:15px;
    right:20px;
    font-size:22px;
    font-weight:bold;
}

#restartBtn{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    font-size:22px;
    z-index:10000;
}
#ranking{
    position:absolute;
    top:130px;
    right:15px;
    width:250px;
    background:white;
    padding:12px;
    border-radius:10px;
    box-shadow:0 0 8px rgba(0,0,0,0.15);
    line-height:1.8;
    font-size:15px;
}
</style>
</head>

<body>

<div id="damage"></div>

<div id="startScreen">

    <div id="startBox">

        <h1>🏢 회사에서 살아남기</h1>

        <p>
        생존 보급품을 획득하고<br>
        칼퇴 방해꾼을 피해<br>
        회사에서 살아남으세요!
        </p>

        <p>
        🎮 조작 방법<br>
        A / D 또는 ← / →
        </p>

        <input id="nickname" placeholder="닉네임 입력">

        <br><br>

        <b>🚫 칼퇴 방해꾼</b><br>
        🔥 야근<br>
        📞 업무 전화<br>
        🚨 회식

        <br><br>

        <b>✅ 생존 보급품</b><br>
        💰 월급 (+100)<br>
        ✈️ 휴가 (+200)<br>
        🏠 칼퇴 (+300)

        <br><br>

        ❤️ 목숨 3개

        <br><br>

        <button onclick="startGame()">
            게임 시작
        </button>

    </div>

</div>

<div id="title">🏢 회사에서 살아남기</div>

<div id="score">점수 : 0</div>
<div id="life">❤️❤️❤️</div>
<div id="nicknameBox"></div>
<div id="level">난이도 : 1</div>

<button id="restartBtn"
onclick="location.reload()">
🔄 다시하기
</button>

<div id="guide">

<b>🎮 이동</b><br>
A / D 또는 ← / →

<br><br>

<b>🚫 칼퇴 방해꾼</b><br>
🔥 야근<br>
📞 업무 전화<br>
🚨 회식

<br><br>

<b>✅ 생존 보급품</b><br>
💰 월급<br>
✈️ 휴가<br>
🏠 칼퇴

</div>

<div id="ranking">
<b>🏆 명예의 사원 TOP 5</b><br>
로딩중...
</div>

<div id="player">🧑‍💼</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  getDocs,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHJK_ZUWoY5aZdlGMZFuqhtUhIXScKzpo",
  authDomain: "company-survival.firebaseapp.com",
  projectId: "company-survival",
  storageBucket: "company-survival.firebasestorage.app",
  messagingSenderId: "596092152573",
  appId: "1:596092152573:web:0839c6a47f37ac3319ac94"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


let score = 0;
let life = 3;
let gameOver = false;
let gameStarted = false;
let playerX = 300;
let nickname = "";
let level = 1;
let speed = 8;

const player = document.getElementById("player");
const scoreBox = document.getElementById("score");
const lifeBox = document.getElementById("life");
const nicknameBox = document.getElementById("nicknameBox");
const damage = document.getElementById("damage");
const levelBox =
document.getElementById("level");

const restartBtn =
document.getElementById("restartBtn");
const rankingBox =
document.getElementById("ranking");

const badItems = ["🔥","📞","🚨"];
const goodItems = ["💰","✈️","🏠"];

function startGame(){

    nickname =
    document.getElementById("nickname")
    .value.trim();

    if(nickname===""){
        alert("닉네임을 입력해주세요.");
        return;
    }

    document.getElementById("startScreen")
    .style.display="none";

    nicknameBox.innerHTML =
    "닉네임 : " + nickname;

    gameStarted = true;
}
window.startGame = startGame;

document.addEventListener("keydown",function(e){

    if(!gameStarted || gameOver)
        return;

    if(
        e.key==="ArrowLeft" ||
        e.key==="a" ||
        e.key==="A"
    ){
        playerX -= 35;
    }

    if(
        e.key==="ArrowRight" ||
        e.key==="d" ||
        e.key==="D"
    ){
        playerX += 35;
    }

    if(playerX < 0)
        playerX = 0;

    if(playerX > window.innerWidth-60)
        playerX = window.innerWidth-60;

    player.style.left =
    playerX + "px";
});

function updateLife(){

    if(life===3) lifeBox.innerHTML="❤️❤️❤️";
    if(life===2) lifeBox.innerHTML="❤️❤️";
    if(life===1) lifeBox.innerHTML="❤️";
    if(life===0) lifeBox.innerHTML="💀";
}

function gameEnd(icon){

    gameOver = true;
    restartBtn.style.display = "block";

    setDoc(
        doc(db,"rankings",nickname),
        {
            name:nickname,
            score:score,
            createdAt:new Date()
        }
    );

    let msg = "";

    if(icon==="🔥")
        msg =
        "🔥 야근에 휘말렸습니다. 오늘도 칼퇴는 다음 생에...";

    if(icon==="📞")
        msg =
        "📞 업무 전화를 받았습니다. 칼퇴에 실패했습니다...";

    if(icon==="🚨")
        msg =
        "🚨 회식을 피하지 못했습니다. 1차만 간다더니...";

    setTimeout(function(){

        alert(
        msg +
        "\n\n닉네임 : " + nickname +
        "\n최종 점수 : " + score
        );

    },100);
}

function createItem(icon,type){

    const item =
    document.createElement("div");

    item.className = "item";
    item.innerHTML = icon;

    let x =
    Math.random() *
    (window.innerWidth-100);

    let y = -50;

    item.style.left = x + "px";
    item.style.top = y + "px";

    document.body.appendChild(item);

    const fall =
    setInterval(function(){

        if(gameOver){
            clearInterval(fall);
            return;
        }

        y += speed;

        item.style.top =
        y + "px";

        const p =
        player.getBoundingClientRect();

        const i =
        item.getBoundingClientRect();

        const hit =

        p.left+20 < i.right &&
        p.right-20 > i.left &&
        p.top+20 < i.bottom &&
        p.bottom-20 > i.top;

        if(hit){

            if(type==="good"){

                if(icon==="💰")
                    score += 100;

                if(icon==="✈️")
                    score += 200;

                if(icon==="🏠")
                    score += 300;

                scoreBox.innerHTML =
                "점수 : " + score;
            }

            if(type==="bad"){

                life--;

                damage.style.opacity = "0.35";

                player.classList.add("hit");

                setTimeout(function(){

                    damage.style.opacity = "0";
                    player.classList.remove("hit");

                },150);

                updateLife();

                if(life<=0){
                    gameEnd(icon);
                }
            }

            item.remove();
            clearInterval(fall);
        }

        if(y > window.innerHeight){

            item.remove();
            clearInterval(fall);
        }

    },20);
}

setInterval(function(){

    if(!gameStarted || gameOver)
        return;

    const icon =
    badItems[
        Math.floor(
        Math.random()*badItems.length
        )
    ];

   for(let i=0;i<level;i++){
    createItem(icon,"bad");
}


},900);

setInterval(function(){

    if(!gameStarted || gameOver)
        return;

    const icon =
    goodItems[
        Math.floor(
        Math.random()*goodItems.length
        )
    ];

    createItem(icon,"good");

},1200);
setInterval(function(){

    if(!gameStarted || gameOver)
        return;

    level++;

    speed += 2;

    levelBox.innerHTML =
    "난이도 : " + level;

},10000);
async function loadRanking(){

    const q = query(
        collection(db,"rankings"),
        orderBy("score","desc"),
        limit(5)
    );

    const snapshot = await getDocs(q);

    let html =
    "<b>🏆 명예의 사원 TOP 5</b><br>";

    let rank = 1;

    snapshot.forEach((doc)=>{

        const data = doc.data();

        let medal = rank + "위";

        if(rank === 1) medal = "🥇";
        if(rank === 2) medal = "🥈";
        if(rank === 3) medal = "🥉";

        html +=
        medal + " " +
        data.name + " : " +
        data.score + "<br>";

        rank++;
    });

    rankingBox.innerHTML = html;
}

loadRanking();
</script>

</body>
</html>
